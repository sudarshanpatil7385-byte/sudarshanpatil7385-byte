<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title description">
  <title id="title">Sudarshan Patil — AI, code, and creativity</title>
  <desc id="description">A dark coding-themed banner with a glowing gradient and a terminal window.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10152b"/>
      <stop offset="1" stop-color="#151b3d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
      <animate attributeName="x1" values="0;1;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1000" height="280" rx="24" fill="url(#background)"/>
  <circle cx="820" cy="55" r="95" fill="#6366f1" opacity=".18" filter="url(#softGlow)"/>
  <circle cx="160" cy="265" r="110" fill="#06b6d4" opacity=".14" filter="url(#softGlow)"/>
  <path d="M0 225 C210 170 350 290 570 220 S830 165 1000 215" fill="none" stroke="url(#glow)" stroke-width="2" opacity=".55"/>
  <text x="68" y="105" fill="#a5b4fc" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3">HELLO, WORLD! I'M</text>
  <text x="64" y="158" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700">Sudarshan Patil</text>
  <text x="68" y="194" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="17">Computer Science · AI &amp; Analytics · Software Development</text>
  <rect x="690" y="77" width="246" height="126" rx="13" fill="#0b1020" stroke="#48517a" stroke-width="1.5"/>
  <path d="M690 107h246" stroke="#48517a"/>
  <circle cx="711" cy="92" r="4" fill="#fb7185"/>
  <circle cx="727" cy="92" r="4" fill="#fbbf24"/>
  <circle cx="743" cy="92" r="4" fill="#34d399"/>
  <text x="711" y="137" fill="#7dd3fc" font-family="Consolas, monospace" font-size="15">&gt; build --future</text>
  <text x="711" y="164" fill="#c4b5fd" font-family="Consolas, monospace" font-size="15">AI + creativity</text>
  <rect x="711" y="177" width="9" height="17" rx="2" fill="#67e8f9">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
