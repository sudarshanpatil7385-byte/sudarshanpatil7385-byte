<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="title description">
  <title id="title">Currently learning: Agentic AI, RAG, and LLMs</title>
  <desc id="description">Animated indeterminate progress bars represent ongoing learning, not completion percentages.</desc>
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#202b45"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>
    <clipPath id="bar1"><rect x="30" y="74" width="700" height="13" rx="6.5"/></clipPath>
    <clipPath id="bar2"><rect x="30" y="139" width="700" height="13" rx="6.5"/></clipPath>
    <clipPath id="bar3"><rect x="30" y="204" width="700" height="13" rx="6.5"/></clipPath>
  </defs>
  <rect x="1" y="1" width="758" height="248" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="30" y="39" fill="#e2e8f0" font-size="17" font-weight="600">Agentic AI</text>
    <text x="730" y="39" fill="#94a3b8" font-size="12" text-anchor="end">LEARNING</text>
    <rect x="30" y="74" width="700" height="13" rx="6.5" fill="url(#track)"/>
    <g clip-path="url(#bar1)">
      <rect x="-245" y="74" width="285" height="13" rx="6.5" fill="url(#progress)">
        <animate attributeName="x" values="-300;760" dur="3.3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="30" y="104" fill="#e2e8f0" font-size="17" font-weight="600">Retrieval-Augmented Generation (RAG)</text>
    <text x="730" y="104" fill="#94a3b8" font-size="12" text-anchor="end">LEARNING</text>
    <rect x="30" y="139" width="700" height="13" rx="6.5" fill="url(#track)"/>
    <g clip-path="url(#bar2)">
      <rect x="-245" y="139" width="285" height="13" rx="6.5" fill="url(#progress)">
        <animate attributeName="x" values="-300;760" dur="3.3s" begin=".45s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="30" y="169" fill="#e2e8f0" font-size="17" font-weight="600">Large Language Models (LLMs)</text>
    <text x="730" y="169" fill="#94a3b8" font-size="12" text-anchor="end">LEARNING</text>
    <rect x="30" y="204" width="700" height="13" rx="6.5" fill="url(#track)"/>
    <g clip-path="url(#bar3)">
      <rect x="-245" y="204" width="285" height="13" rx="6.5" fill="url(#progress)">
        <animate attributeName="x" values="-300;760" dur="3.3s" begin=".9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
